name: shorts
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install google-generativeai edge-tts moviepy
      - run: python bot.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
